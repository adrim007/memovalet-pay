<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemoValet · New advert preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17112d;color:#fff;font:16px system-ui;padding:24px}main{max-width:1280px;margin:0 auto}h1{font-size:20px;margin:0 0 8px}p{color:#c9beda;font-size:14px;margin:0 0 20px}canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:18px;background:#f2eff9}.controls{display:flex;gap:16px;align-items:center;padding:18px 0}button{border:0;border-radius:24px;padding:12px 22px;background:#d5fa85;color:#17152a;font:600 15px system-ui;cursor:pointer}input{flex:1;accent-color:#a987ff}output{font-variant-numeric:tabular-nums;min-width:90px}.note{font-size:13px}a{color:#d5fa85}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:4px}</style>
<main><h1>Less chasing. More done.</h1><p>60-second editorial preview · actual MemoValet example screens · soundtrack/export pending</p><canvas width="1280" height="720" role="img" aria-label="Animated MemoValet product advert showing the dashboard, projects, work, files and meeting library"></canvas><div class="controls"><button id="play">Play preview</button><input id="seek" aria-label="Timeline" type="range" min="0" max="60" step=".05" value="0"><output>0:00 / 1:00</output></div><p class="note">This is the local visual edit, not the published Watch demo video. No private account data is shown.</p></main>
<script src="film.js"></script><script>
const film=MemoValetFilm,images={},canvas=document.querySelector('canvas'),button=document.querySelector('#play'),seek=document.querySelector('#seek'),out=document.querySelector('output');let draw,playing=false,time=0,last=0;
Promise.all(film.assets.map(name=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{images[name]=i;resolve()};i.onerror=reject;i.src=name+'.png'}))).then(()=>{draw=film.createFilm(canvas.getContext('2d'),images);draw(0)}).catch(()=>{document.querySelector('p').textContent='A preview asset could not load. Please refresh.'});
button.onclick=()=>{if(!draw)return;if(time>=60)time=0;playing=!playing;button.textContent=playing?'Pause':'Play preview';last=performance.now()};seek.oninput=()=>{time=Number(seek.value);if(draw)draw(time);update()};function update(){seek.value=time;out.textContent=`${Math.floor(time/60)}:${String(Math.floor(time%60)).padStart(2,'0')} / 1:00`}
function tick(now){if(playing&&draw){time=Math.min(60,time+(now-last)/1000);draw(time);update();if(time>=60){playing=false;button.textContent='Replay'}}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
