<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemoValet · Product motion test</title>
<style>*{box-sizing:border-box}body{margin:0;background:#15121c;color:#f4f1f8;font:15px system-ui;padding:24px}main{max-width:1440px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:18px;margin:0}p{color:#bfb5ce;font-size:13px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#edeaf6;border-radius:12px}.controls{display:flex;align-items:center;gap:20px;margin:18px 0}button{background:#c3a4ff;border:0;border-radius:24px;color:#21132f;padding:12px 24px;font:600 15px system-ui;cursor:pointer}input{flex:1;accent-color:#c3a4ff}output{min-width:90px}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:4px}</style>
<main><header><h1>MemoValet / a closer look</h1><span>12-second motion test</span></header><canvas width="1440" height="810" role="img" aria-label="MemoValet example dashboard moves into a project and its Share panel"></canvas><div class="controls"><button id="play">Play new direction</button><input type="range" id="seek" aria-label="Timeline" min="0" max="12" step=".01" value="0"><output>0:00 / 0:12</output></div><p>Visual direction only — no soundtrack yet. Uses the real example dashboard. The live Watch Demo has not been replaced.</p></main>
<script src="teaser.js"></script><script>
const film=MemoValetTeaser,images={},canvas=document.querySelector('canvas'),button=document.querySelector('#play'),seek=document.querySelector('#seek'),out=document.querySelector('output');let draw,playing=false,time=0,last=0;
Promise.all(film.assets.map(name=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{images[name]=i;resolve()};i.onerror=reject;i.src=name+'.png'}))).then(()=>{draw=film.createFilm(canvas.getContext('2d'),images);draw(0)}).catch(()=>document.querySelector('p').textContent='A preview asset could not load. Please refresh.');
button.onclick=()=>{if(!draw)return;if(time>=12)time=0;playing=!playing;button.textContent=playing?'Pause':'Play new direction';last=performance.now()};seek.oninput=()=>{time=Number(seek.value);if(draw)draw(time);update()};function update(){seek.value=time;out.textContent=`0:${String(Math.floor(time)).padStart(2,'0')} / 0:12`}
function tick(now){if(playing&&draw){time=Math.min(12,time+(now-last)/1000);draw(time);update();if(time>=12){playing=false;button.textContent='Replay'}}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
